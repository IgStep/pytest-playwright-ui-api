name: Ruff check

on: [push]

jobs:
  run_ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Analysing the code with ruff cheker
      run: |
        ruff check $(git ls-files '*.py')
